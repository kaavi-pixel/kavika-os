[Service]
# Live overlay copy-up creates parent directories with tmpfs labels.
# Run after policy load and tmpfiles, before normal services and live-user setup.
# Label ancestors non-recursively, then only our payload paths recursively.
ExecStartPost=/usr/sbin/restorecon -F / /etc /etc/skel /etc/xdg /etc/xdg/autostart /usr /usr/bin /usr/lib /usr/lib/systemd /usr/lib/systemd/system /usr/local /usr/local/bin /usr/share /usr/share/applications /usr/share/kwin /usr/share/kwin/scripts /var /var/lib
ExecStartPost=/usr/sbin/restorecon -RF /etc/skel /etc/xdg/autostart /usr/local /usr/share/kavika /usr/share/kwin/scripts/kavika-preview /usr/share/applications/kavika-test-centre.desktop /usr/share/applications/liveinst.desktop /usr/bin/liveinst /usr/bin/plasma-welcome /var/lib/livesys /usr/lib/systemd/system/systemd-tmpfiles-setup.service.d
